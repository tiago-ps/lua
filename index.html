<title>Minha Lua</title>
<style>
:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#101b35;color:#fff}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 20px;text-align:center}
h1{font-size:clamp(3.3rem,11vw,6rem);line-height:1.08;margin:8px 0 8px;color:#fff}
#date{font-size:clamp(3.4rem,11.5vw,5.8rem)!important;line-height:1.08;color:inherit;margin:0;font-weight:800}
#moon{width:min(58vw,330px);height:auto;margin:10px 0;filter:drop-shadow(0 0 28px #dce8ff55);cursor:pointer}#moon:focus-visible{outline:4px solid #7ed6ff;outline-offset:8px;border-radius:50%}
#phase{font-size:clamp(2rem,7vw,4.2rem);font-weight:800;margin:0}
#description{font-size:clamp(1.2rem,3.5vw,1.8rem);line-height:1.4;max-width:760px;color:#e3eaff;margin:10px auto 8px}
#seasonTip{font-size:clamp(1.05rem,3vw,1.35rem);line-height:1.4;max-width:760px;color:#d5e2fa;margin:0 auto 14px}
.nav,.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:min(100%,850px)}
.nav{margin:5px 0 16px}
button{border:0;border-radius:18px;padding:15px 22px;min-height:62px;font-size:clamp(1.05rem,3vw,1.4rem);font-weight:700;color:#101b35;background:#f3f5fb;cursor:pointer}
button.primary{background:#f4d77c}
button:focus-visible{outline:4px solid #7ed6ff;outline-offset:4px}
button.small{font-size:1rem;min-height:48px;padding:10px 15px}
button:disabled{cursor:not-allowed}
.hint{margin-top:18px;color:#b9c8e8;font-size:1.05rem}
@media(orientation:landscape) and (min-width:700px){main{padding:8px 24px}#date{font-size:clamp(3.1rem,9.2vh,5.1rem)!important;line-height:1.05}h1{margin:2px 0 4px}#moon{width:min(30vh,220px);margin:2px}#description{margin:4px auto 6px}#seasonTip{margin-bottom:6px}.nav{margin:2px 0 8px}}
</style>
</head>
<body>
<main>
<h1 id="date" aria-live="polite"></h1>
<svg id="moon" viewBox="0 0 300 300" role="button" tabindex="0" aria-label="Abrir as próximas luas">
<defs><clipPath id="moonClip"><circle cx="150" cy="150" r="112"/></clipPath></defs>
<circle cx="150" cy="150" r="112" fill="#263653"/>
<g id="lit" clip-path="url(#moonClip)"></g>
<g fill="#b8ad8d" opacity=".45"><circle cx="105" cy="100" r="13"/><circle cx="190" cy="115" r="9"/><circle cx="165" cy="190" r="18"/><circle cx="95" cy="185" r="7"/></g>
</svg>
<p id="phase">Carregando...</p>
<p id="description">Veja como a Lua está hoje.</p>
<p id="seasonTip"></p>
<div class="nav">
<button id="prev" type="button">◀ Anterior</button>
<button id="today" class="primary" type="button">Hoje</button>
<button id="next" type="button">Próximo ▶</button>
</div>
<div class="actions"><button class="primary" id="speak" type="button">🔊 Ouvir</button><button id="install" type="button">📲 Instalar</button></div>
<section id="installHelp" hidden style="width:min(100%,700px);margin-top:16px;padding:18px;border-radius:18px;background:#243657;font-size:1.1rem;line-height:1.5"><p style="margin-top:0;font-weight:bold">Como colocar no celular</p><p id="installSteps" style="margin-bottom:12px">Abra o menu do navegador e escolha “Adicionar à tela inicial” ou “Instalar aplicativo”.</p><button id="closeInstall" class="small" type="button">Fechar</button></section>
</main>
<script>
(function(){
const synodic=29.530588853;
const reference=Date.UTC(2000,0,6,18,14);
function dateFromQuery(){
 const value=new URLSearchParams(location.search).get("date");
 if(!/^\d{4}-\d{2}-\d{2}$/.test(value||""))return null;
 const parts=value.split("-").map(Number);const date=new Date(parts[0],parts[1]-1,parts[2],12,0,0,0);
 return Number.isNaN(date.getTime())?null:date;
}
let shown=dateFromQuery()||new Date();shown.setHours(12,0,0,0);
const today=new Date();today.setHours(12,0,0,0);
function shiftMonths(date,months){
 const result=new Date(date);const day=result.getDate();
 result.setDate(1);result.setMonth(result.getMonth()+months);
 const lastDay=new Date(result.getFullYear(),result.getMonth()+1,0).getDate();
 result.setDate(Math.min(day,lastDay));return result;
}
const minDate=shiftMonths(today,-6),maxDate=shiftMonths(today,6);
const phases=[
 {name:"Lua nova",tip:"Prepare a terra para o plantio. Misture composto bem curtido e deixe o canteiro pronto."},
 {name:"Lua crescendo",tip:"Cuide das plantas que estão crescendo. Regue quando a terra começar a secar."},
 {name:"Lua crescente",tip:"É um bom momento para cuidar das folhas e dos brotos. Retire o mato com cuidado."},
 {name:"Lua quase cheia",tip:"Observe as plantas e amarre os ramos que precisam de apoio. Veja se há insetos nas folhas."},
 {name:"Lua cheia",tip:"Aproveite para colher os alimentos maduros. Retire também as folhas secas."},
 {name:"Lua diminuindo",tip:"Cuide das raízes. Deixe a terra fofa e veja se a água consegue escoar."},
 {name:"Lua minguante",tip:"Limpe os canteiros e coloque folhas secas sobre a terra para protegê-la."},
 {name:"Lua minguante",tip:"Prepare adubo com restos de folhas e retire galhos secos ou doentes."}
];
const el=id=>document.getElementById(id);
function drawMoon(fraction){
 const lit=el("lit");lit.innerHTML="";
 const ns="http://www.w3.org/2000/svg",r=112,cx=150,cy=150;
 const add=(tag,attrs)=>{const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));lit.appendChild(n);return n;};
 if(fraction<=.02||fraction>=.98)return;
 if(Math.abs(fraction-.5)<.02){add("circle",{cx,cy,r,fill:"#f4e7b6"});return;}
 const waxing=fraction<.5;
 const litFraction=(1-Math.cos(2*Math.PI*fraction))/2;
 const rx=r*Math.abs(Math.cos(2*Math.PI*fraction));
 const points=[];
 const start=waxing?-Math.PI/2:Math.PI/2;
 const end=waxing?Math.PI/2:3*Math.PI/2;
 for(let i=0;i<=40;i++){
  const t=start+(end-start)*i/40;
  points.push([cx+r*Math.cos(t),cy+r*Math.sin(t)]);
 }
 const sign=waxing?1:-1;
 for(let i=0;i<=40;i++){
  const t=waxing?Math.PI/2-Math.PI*i/40:3*Math.PI/2-Math.PI*i/40;
  points.push([cx+sign*r*Math.cos(2*Math.PI*fraction)*Math.cos(t),cy+r*Math.sin(t)]);
 }
 const d=points.map((p,i)=>(i?"L":"M")+p[0].toFixed(2)+" "+p[1].toFixed(2)).join(" ")+" Z";
 add("path",{d,fill:"#f4e7b6"});
}
function render(){
 const age=((shown.getTime()-reference)/86400000%synodic+synodic)%synodic;
 const fraction=age/synodic;
 const index=Math.round(fraction*8)%8;
 drawMoon(fraction);
 const info=phases[index];
 el("phase").textContent=info.name;
 const dateText=shown.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
 el("date").textContent=dateText.charAt(0).toUpperCase()+dateText.slice(1);
 el("description").textContent=info.tip;
 const month=shown.getMonth();
 el("seasonTip").textContent=(month>=9||month<=2)
  ?"Dica da época: com as chuvas, veja se a água está escoando e evite deixar a terra encharcada."
  :"Dica da época: em meses mais secos, cubra a terra com folhas secas e regue quando ela começar a secar.";
 el("moon").setAttribute("aria-label",info.name);
 el("prev").disabled=shown<=minDate;el("next").disabled=shown>=maxDate;
 el("prev").style.opacity=el("prev").disabled?".45":"1";
 el("next").style.opacity=el("next").disabled?".45":"1";
}
function openPhases(){location.href="./fases.html?date="+shown.toISOString().slice(0,10);}
el("moon").addEventListener("click",openPhases);
el("moon").addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();openPhases();}});
function move(days){const next=new Date(shown);next.setDate(next.getDate()+days);if(next<minDate||next>maxDate)return;shown=next;render();}
el("prev").addEventListener("click",()=>move(-1));
el("next").addEventListener("click",()=>move(1));
el("today").addEventListener("click",()=>{shown=new Date();shown.setHours(12,0,0,0);render();});
el("speak").addEventListener("click",()=>{
 if(!("speechSynthesis" in window)){alert("Este aparelho não tem leitura em voz alta.");return;}
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(el("phase").textContent+". "+el("date").textContent+". "+el("description").textContent+" "+el("seasonTip").textContent);
 utterance.lang="pt-BR";utterance.rate=.88;speechSynthesis.speak(utterance);
});
let installPrompt=null;
function isInstalled(){return window.matchMedia("(display-mode: standalone)").matches||window.matchMedia("(display-mode: fullscreen)").matches||navigator.standalone===true;}
if(isInstalled())el("install").hidden=true;
window.addEventListener("appinstalled",()=>{el("install").hidden=true;el("installHelp").hidden=true;installPrompt=null;});
window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();installPrompt=event;});
el("install").addEventListener("click",async()=>{
 if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;return;}
 const ua=navigator.userAgent;
 let steps="Abra o menu do navegador (os três pontinhos) e escolha “Instalar aplicativo” ou “Adicionar à tela inicial”.";
 if(/iPhone|iPad|iPod/i.test(ua))steps="No Safari, toque em “Compartilhar” (o quadrado com a seta para cima). Depois escolha “Adicionar à Tela de Início” e toque em “Adicionar”.";
 else if(/Android/i.test(ua))steps="No Chrome, toque nos três pontinhos no alto da tela. Escolha “Instalar aplicativo” ou “Adicionar à tela inicial”.";
 el("installSteps").textContent=steps;el("installHelp").hidden=false;
});
el("closeInstall").addEventListener("click",()=>{el("installHelp").hidden=true;});
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("./sw.js").catch(()=>{});}
render();
})();
</script>
</body>
</html>
